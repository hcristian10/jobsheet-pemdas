<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Kelulusan Siswa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button id="btn-tema">Mode Gelap</button>

    <div class="container">
        <h2>Kalkulator Kelulusan Siswa</h2>
        <p>Masukkan nama dan nilai untuk mengecek kelulusan.</p>

        
        <div class="form-group">
            <label for="input-nama">Nama Siswa:</label>
            <input type="text" id="input-nama" placeholder="Contoh: Howard">
        </div>

        <div class="form-group">
            <label for="input-nilai">Nilai Ujian:</label>
            <input type="number" id="input-nilai" placeholder="Contoh: 100">
        </div>

        
        <button id="btn-proses">Proses Data Nilai</button>
        

        
        <div id="box-hasil" class="box-hasil">
            Hasil evaluasi nilai akan muncul di sini.
        </div>
    </div>

    
    <script src="script.js"></script>
</body>
</html>
