
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak Saya</title>
</head>
<body>

    <header>
        <h1>Hubungi Saya</h1>
        <p>Formulir aspirasi, pesan, dan saran</p>
    </header>

    <nav>
        <a href="index.html">Beranda</a> |
        <a href="index.html#tentang">Tentang Saya</a> |
        <a href="kontak.html">Kontak</a>
    </nav>

    <main>
        <section>
            <h2>Formulir Kontak</h2>
            <p>Silakan isi formulir berikut untuk mengirim pesan.</p>

            <form action="#" method="post">

                <p>
                    <label for="nama">Nama:</label><br>
                    <input type="text"
                           id="nama"
                           name="nama"
                           placeholder="Masukkan nama kamu"
                           required>
                </p>

                <p>
                    <label for="email">Email:</label><br>
                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="nama@email.com"
                           required>
                </p>

                <p>
                    <label for="pesan">Pesan atau Saran:</label><br>
                    <textarea id="pesan"
                              name="pesan"
                              rows="5"
                              cols="35"
                              placeholder="Tuliskan pesan atau saran kamu..."
                              required></textarea>
                </p>

                <button type="submit">Kirim Pesan</button>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Nama Lengkap Kamu</p>
        <p><a href="index.html">Kembali ke Beranda</a></p>
    </footer>

</body>
</html>
